<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <rect width="240" height="240" rx="16" fill="#FFFFFF" />
  
  <!-- Outer Corner Finders -->
  <!-- Top Left -->
  <rect x="20" y="20" width="56" height="56" rx="10" stroke="#0F172A" stroke-width="8" />
  <rect x="34" y="34" width="28" height="28" rx="6" fill="#0D9488" />
  
  <!-- Top Right -->
  <rect x="164" y="20" width="56" height="56" rx="10" stroke="#0F172A" stroke-width="8" />
  <rect x="178" y="34" width="28" height="28" rx="6" fill="#0D9488" />
  
  <!-- Bottom Left -->
  <rect x="20" y="164" width="56" height="56" rx="10" stroke="#0F172A" stroke-width="8" />
  <rect x="34" y="178" width="28" height="28" rx="6" fill="#0D9488" />

  <!-- Data Matrix Dots & Modules -->
  <g fill="#0F172A">
    <!-- Row 1 -->
    <rect x="90" y="24" width="10" height="10" rx="2" />
    <rect x="110" y="24" width="10" height="10" rx="2" />
    <rect x="140" y="24" width="10" height="10" rx="2" />
    
    <!-- Row 2 -->
    <rect x="90" y="44" width="20" height="10" rx="2" />
    <rect x="130" y="44" width="10" height="10" rx="2" />
    
    <!-- Row 3 -->
    <rect x="90" y="64" width="10" height="10" rx="2" />
    <rect x="110" y="64" width="20" height="10" rx="2" />
    <rect x="140" y="64" width="10" height="10" rx="2" />

    <!-- Center Cross pattern -->
    <rect x="24" y="90" width="10" height="20" rx="2" />
    <rect x="44" y="100" width="20" height="10" rx="2" />
    <rect x="74" y="90" width="10" height="10" rx="2" />
    
    <!-- Center Column -->
    <rect x="90" y="90" width="12" height="12" rx="3" fill="#0284C7" />
    <rect x="138" y="90" width="12" height="12" rx="3" fill="#0284C7" />
    <rect x="90" y="138" width="12" height="12" rx="3" fill="#0284C7" />
    <rect x="138" y="138" width="12" height="12" rx="3" fill="#0284C7" />

    <!-- Center Brand Icon in QR -->
    <circle cx="120" cy="120" r="22" fill="#0D9488" />
    <path d="M114 120 L118 124 L127 115" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Side -->
    <rect x="164" y="90" width="10" height="10" rx="2" />
    <rect x="190" y="90" width="20" height="10" rx="2" />
    <rect x="174" y="110" width="10" height="20" rx="2" />
    <rect x="200" y="120" width="10" height="10" rx="2" />
    <rect x="164" y="140" width="20" height="10" rx="2" />

    <!-- Bottom Center & Right -->
    <rect x="90" y="164" width="20" height="10" rx="2" />
    <rect x="120" y="164" width="10" height="20" rx="2" />
    <rect x="140" y="174" width="10" height="10" rx="2" />
    <rect x="90" y="194" width="10" height="10" rx="2" />
    <rect x="110" y="194" width="30" height="10" rx="2" />
    
    <rect x="164" y="164" width="10" height="10" rx="2" />
    <rect x="184" y="164" width="20" height="10" rx="2" />
    <rect x="164" y="184" width="20" height="10" rx="2" />
    <rect x="194" y="194" width="20" height="10" rx="2" />
    <rect x="174" y="204" width="10" height="10" rx="2" />
  </g>
